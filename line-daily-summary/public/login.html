<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>เข้าสู่ระบบ — สมุดบันทึกกลุ่มไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-900: #14261F;
    --ink-700: #23413A;
    --paper-050: #F6F2E9;
    --paper-100: #ECE4D2;
    --brass-500: #B08D3D;
    --brass-600: #96742E;
    --text-900: #1B1B18;
    --text-on-dark: #F1ECDE;
    --danger: #B3462C;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    font-family: 'Sarabun', sans-serif;
    background: var(--ink-900);
    color: var(--text-900);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.04), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,0.03), transparent 45%);
  }
  .panel {
    width: 100%;
    max-width: 380px;
    background: var(--paper-050);
    border-radius: 4px;
    padding: 40px 36px 36px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5);
    border-top: 4px solid var(--brass-500);
  }
  .mark {
    font-family: 'Kanit', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--brass-600);
    margin: 0 0 6px;
  }
  h1 {
    font-family: 'Kanit', sans-serif;
    font-weight: 700;
    font-size: 26px;
    line-height: 1.25;
    margin: 0 0 6px;
    color: var(--ink-900);
  }
  .sub {
    font-size: 14px;
    color: #5B5B4F;
    margin: 0 0 28px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #4A4A3E;
    margin-bottom: 6px;
  }
  .field { margin-bottom: 18px; }
  input {
    width: 100%;
    font-family: 'Sarabun', sans-serif;
    font-size: 15px;
    padding: 11px 13px;
    border: 1px solid #D8CFB8;
    border-radius: 3px;
    background: #FFFDF8;
    color: var(--text-900);
  }
  input:focus {
    outline: none;
    border-color: var(--brass-500);
    box-shadow: 0 0 0 3px rgba(176,141,61,0.18);
  }
  button {
    width: 100%;
    margin-top: 8px;
    padding: 12px 13px;
    border: none;
    border-radius: 3px;
    background: var(--ink-900);
    color: var(--text-on-dark);
    font-family: 'Sarabun', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--ink-700); }
  .error {
    background: #FBEAE4;
    border: 1px solid #EAC1B2;
    color: var(--danger);
    font-size: 13.5px;
    padding: 10px 12px;
    border-radius: 3px;
    margin-bottom: 18px;
  }
</style>
</head>
<body>
  <div class="panel">
    <p class="mark">สมุดบันทึกกลุ่มไลน์</p>
    <h1>เข้าสู่ระบบ</h1>
    <p class="sub">สำหรับดูสรุปบทสนทนาประจำวันของกลุ่มไลน์ที่เชื่อมต่อไว้</p>

    <div id="errorBox" class="error" style="display:none;">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>

    <form method="POST" action="/login">
      <div class="field">
        <label for="username">ชื่อผู้ใช้</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus />
      </div>
      <div class="field">
        <label for="password">รหัสผ่าน</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button type="submit">เข้าสู่ระบบ</button>
    </form>
  </div>

  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('errorBox').style.display = 'block';
    }
  </script>
</body>
</html>
