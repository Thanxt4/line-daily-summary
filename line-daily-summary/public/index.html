<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>สมุดบันทึกกลุ่มไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-900: #14261F;
    --ink-800: #1A322A;
    --ink-700: #23413A;
    --paper-050: #F6F2E9;
    --paper-100: #ECE4D2;
    --paper-200: #E1D7BE;
    --brass-500: #B08D3D;
    --brass-600: #96742E;
    --text-900: #1B1B18;
    --text-600: #5B5B4F;
    --text-on-dark: #F1ECDE;
    --text-on-dark-dim: #A9BBB2;
    --danger: #B3462C;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Sarabun', sans-serif;
    color: var(--text-900);
    background: var(--paper-050);
  }
  .app {
    display: flex;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 268px;
    flex-shrink: 0;
    background: var(--ink-900);
    color: var(--text-on-dark);
    display: flex;
    flex-direction: column;
    padding: 28px 22px;
  }
  .brand {
    margin-bottom: 30px;
  }
  .brand .mark {
    font-family: 'Kanit', sans-serif;
    font-weight: 500;
    font-size: 12px;
    color: var(--brass-500);
    margin: 0 0 4px;
  }
  .brand h1 {
    font-family: 'Kanit', sans-serif;
    font-weight: 700;
    font-size: 21px;
    line-height: 1.3;
    margin: 0;
    color: var(--text-on-dark);
  }
  .group-list-label {
    font-size: 12.5px;
    color: var(--text-on-dark-dim);
    margin: 0 0 10px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .group-list {
    list-style: none;
    margin: 0;
    padding: 0;
    flex: 1;
    overflow-y: auto;
  }
  .group-item {
    padding: 11px 12px;
    border-radius: 3px;
    font-size: 14.5px;
    cursor: pointer;
    color: var(--text-on-dark-dim);
    margin-bottom: 3px;
    line-height: 1.4;
    word-break: break-word;
  }
  .group-item:hover { background: rgba(255,255,255,0.06); color: var(--text-on-dark); }
  .group-item.active {
    background: var(--brass-500);
    color: var(--ink-900);
    font-weight: 600;
  }
  .empty-groups {
    font-size: 13.5px;
    color: var(--text-on-dark-dim);
    padding: 8px 4px;
    line-height: 1.6;
  }
  .sidebar-footer {
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 16px;
    margin-top: 12px;
  }
  .logout-form button {
    width: 100%;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.18);
    color: var(--text-on-dark-dim);
    padding: 9px 10px;
    border-radius: 3px;
    font-family: 'Sarabun', sans-serif;
    font-size: 13.5px;
    cursor: pointer;
  }
  .logout-form button:hover { color: var(--text-on-dark); border-color: rgba(255,255,255,0.35); }

  /* ---------- Main content ---------- */
  .main {
    flex: 1;
    padding: 40px 48px 60px;
    max-width: 1320px;
  }
  .main-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 34px;
    border-bottom: 1px solid var(--paper-200);
    padding-bottom: 22px;
  }
  .main-header h2 {
    font-family: 'Kanit', sans-serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0 0 4px;
    color: var(--ink-900);
  }
  .main-header p {
    margin: 0;
    font-size: 13.5px;
    color: var(--text-600);
  }
  .btn-summarize {
    flex-shrink: 0;
    background: var(--ink-900);
    color: var(--text-on-dark);
    border: none;
    padding: 11px 20px;
    border-radius: 3px;
    font-family: 'Sarabun', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-summarize:hover { background: var(--ink-700); }
  .btn-summarize:disabled { opacity: 0.55; cursor: default; }

  /* ---------- Date range filter ---------- */
  .date-range-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 24px;
  }
  .date-range-bar label {
    font-size: 12.5px;
    color: var(--text-600);
    margin-right: 4px;
  }
  .date-range-bar input[type="date"] {
    font-family: 'Sarabun', sans-serif;
    font-size: 13.5px;
    color: var(--text-900);
    background: #fff;
    border: 1px solid var(--paper-200);
    border-radius: 3px;
    padding: 7px 9px;
  }
  .date-range-bar .range-sep {
    color: var(--text-600);
    font-size: 13px;
  }
  .btn-quick-range {
    background: transparent;
    border: 1px solid var(--paper-200);
    color: var(--ink-800);
    padding: 7px 12px;
    border-radius: 3px;
    font-family: 'Sarabun', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-quick-range:hover { background: var(--paper-100); }
  .btn-quick-range.active {
    background: var(--brass-500);
    border-color: var(--brass-500);
    color: var(--ink-900);
    font-weight: 600;
  }

  /* ---------- Ledger timeline ---------- */
  .ledger {
    position: relative;
    padding-left: 26px;
  }
  .ledger::before {
    content: '';
    position: absolute;
    left: 5px;
    top: 6px;
    bottom: 6px;
    width: 1px;
    background: var(--paper-200);
  }
  .entry {
    position: relative;
    padding-bottom: 34px;
  }
  .entry::before {
    content: '';
    position: absolute;
    left: -26px;
    top: 5px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--brass-500);
    border: 2px solid var(--paper-050);
    box-shadow: 0 0 0 1px var(--paper-200);
  }
  .entry-date {
    font-family: 'Kanit', sans-serif;
    font-weight: 600;
    font-size: 15.5px;
    color: var(--ink-900);
    margin: 0 0 3px;
  }
  .entry-meta {
    font-size: 12.5px;
    color: var(--text-600);
    margin: 0 0 12px;
  }
  .entry-summary {
    background: var(--paper-100);
    border-radius: 3px;
    padding: 16px 18px;
    font-size: 14.5px;
    line-height: 1.7;
    white-space: pre-wrap;
    color: var(--text-900);
  }
  .entry-summary.empty {
    color: var(--text-600);
    font-style: italic;
    white-space: normal;
  }
  .summary-table-wrap {
    background: var(--paper-100);
    border-radius: 3px;
    padding: 6px;
    overflow-x: auto;
  }
  table.summary-table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    font-size: 12.5px;
    min-width: 920px;
  }
  table.summary-table th,
  table.summary-table td {
    text-align: left;
    vertical-align: top;
    padding: 11px 13px;
    border-bottom: 1px solid var(--paper-200);
    line-height: 1.6;
    word-break: break-word;
    overflow-wrap: break-word;
  }
  table.summary-table thead th {
    font-family: 'Kanit', sans-serif;
    font-weight: 600;
    font-size: 12px;
    color: var(--ink-900);
    background: var(--paper-200);
    white-space: nowrap;
  }
  table.summary-table col.col-no { width: 34px; }
  table.summary-table col.col-what { width: 19%; }
  table.summary-table col.col-who { width: 15%; }
  table.summary-table col.col-when { width: 10%; }
  table.summary-table col.col-where { width: 13%; }
  table.summary-table col.col-why { width: 19%; }
  table.summary-table col.col-how { width: 20%; }
  table.summary-table tbody tr:last-child td { border-bottom: none; }
  table.summary-table tbody tr:hover { background: rgba(176, 141, 61, 0.08); }
  table.summary-table td.col-topic-no {
    font-family: 'Kanit', sans-serif;
    font-weight: 600;
    color: var(--brass-600);
    white-space: nowrap;
    text-align: center;
  }
  .entry-images {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 14px;
  }
  .entry-image {
    margin: 0;
    width: 152px;
  }
  .entry-image img {
    width: 100%;
    height: 110px;
    object-fit: cover;
    border-radius: 3px;
    border: 1px solid var(--paper-200);
    display: block;
    background: var(--paper-100);
  }
  .entry-image figcaption {
    font-size: 12px;
    color: var(--text-600);
    margin-top: 5px;
    line-height: 1.4;
  }

  .state-msg {
    color: var(--text-600);
    font-size: 14px;
    padding: 12px 0;
  }
  .state-msg.error { color: var(--danger); }
</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <p class="mark">Daily Digest</p>
        <h1>สมุดบันทึก<br/>กลุ่มไลน์</h1>
      </div>
      <p class="group-list-label">กลุ่มที่เชื่อมต่อ</p>
      <ul class="group-list" id="groupList">
        <li class="empty-groups">กำลังโหลด...</li>
      </ul>
      <div class="sidebar-footer">
        <form class="logout-form" method="POST" action="/logout">
          <button type="submit">ออกจากระบบ</button>
        </form>
      </div>
    </aside>

    <main class="main">
      <div class="main-header">
        <div>
          <h2 id="groupTitle">เลือกกลุ่มทางซ้าย</h2>
          <p id="groupSub">สรุปบทสนทนาประจำวันจะแสดงที่นี่</p>
        </div>
        <button class="btn-summarize" id="summarizeBtn" disabled>สรุปวันนี้ทันที</button>
      </div>

      <div class="date-range-bar">
        <button type="button" class="btn-quick-range" id="quickToday">วันนี้</button>
        <button type="button" class="btn-quick-range" id="quick7">7 วันล่าสุด</button>
        <button type="button" class="btn-quick-range" id="quick30">30 วันล่าสุด</button>
        <button type="button" class="btn-quick-range" id="quickAll">ทั้งหมด</button>
        <label for="fromDate">จาก</label>
        <input type="date" id="fromDate" />
        <span class="range-sep">ถึง</span>
        <input type="date" id="toDate" />
      </div>

      <div id="content">
        <p class="state-msg">เลือกกลุ่มไลน์จากเมนูด้านซ้ายเพื่อดูสรุปประจำวัน</p>
      </div>
    </main>
  </div>

<script>
let currentGroupId = null;
let currentGroupName = '';

// วันที่ปัจจุบันตามเวลาไทย (Asia/Bangkok) รูปแบบ YYYY-MM-DD ให้ตรงกับที่เก็บใน DB
function todayBangkok() {
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Bangkok',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).format(new Date());
}

function addDaysToDateStr(dateStr, days) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + days);
  return dt.toISOString().slice(0, 10);
}

// ค่าเริ่มต้น: แสดงของวันนี้ก่อน
let fromDate = todayBangkok();
let toDate = todayBangkok();

function setQuickRangeActive(id) {
  document.querySelectorAll('.btn-quick-range').forEach((btn) => btn.classList.remove('active'));
  if (id) document.getElementById(id)?.classList.add('active');
}

function applyDateRange(from, to, quickId) {
  fromDate = from;
  toDate = to;
  document.getElementById('fromDate').value = from || '';
  document.getElementById('toDate').value = to || '';
  setQuickRangeActive(quickId);
  if (currentGroupId) loadSummaries();
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (res.status === 401) {
    location.href = '/login';
    throw new Error('unauthorized');
  }
  return res;
}

function formatThaiDate(dateStr) {
  const months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const [y, m, d] = dateStr.split('-').map(Number);
  return `${d} ${months[m - 1]} ${y + 543}`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function loadGroups() {
  const listEl = document.getElementById('groupList');
  try {
    const res = await api('/api/groups');
    const groups = await res.json();
    if (groups.length === 0) {
      listEl.innerHTML = '<li class="empty-groups">ยังไม่มีกลุ่มไลน์เข้ามา<br/>รอข้อความแรกจากกลุ่ม</li>';
      return;
    }
    listEl.innerHTML = groups
      .map((g) => `<li class="group-item" data-id="${g.group_id}" data-name="${escapeHtml(g.group_name || g.group_id)}">${escapeHtml(g.group_name || g.group_id)}</li>`)
      .join('');
    listEl.querySelectorAll('.group-item').forEach((el) => {
      el.addEventListener('click', () => selectGroup(el.dataset.id, el.dataset.name, el));
    });
    if (groups.length > 0) {
      const first = listEl.querySelector('.group-item');
      selectGroup(first.dataset.id, first.dataset.name, first);
    }
  } catch (e) {
    if (e.message !== 'unauthorized') {
      listEl.innerHTML = '<li class="empty-groups">โหลดรายชื่อกลุ่มไม่สำเร็จ</li>';
    }
  }
}

function selectGroup(groupId, groupName, el) {
  currentGroupId = groupId;
  currentGroupName = groupName;
  document.querySelectorAll('.group-item').forEach((e) => e.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('groupTitle').textContent = groupName;
  document.getElementById('groupSub').textContent = 'สรุปบทสนทนาประจำวัน เรียงจากล่าสุด';
  document.getElementById('summarizeBtn').disabled = false;
  loadSummaries();
}

// รับค่า s.summary ซึ่งอาจเป็น:
// 1) JSON string รูปแบบใหม่ { topics: [{what, who, when, where, why, how}], raw? }
// 2) ข้อความธรรมดารูปแบบเก่า (Harvard Outline) จากก่อนอัปเดต
// แล้ว render เป็นตาราง 5W1H หรือ fallback เป็นข้อความธรรมดา
function renderSummaryBlock(summaryRaw) {
  if (!summaryRaw) {
    return '<div class="entry-summary empty">ไม่มีสาระสำคัญที่บันทึกไว้สำหรับวันนี้</div>';
  }

  let parsed = null;
  try {
    parsed = JSON.parse(summaryRaw);
  } catch (e) {
    // ไม่ใช่ JSON แปลว่าเป็นข้อมูลเก่ารูปแบบข้อความธรรมดา
    return `<div class="entry-summary">${escapeHtml(summaryRaw)}</div>`;
  }

  const topics = Array.isArray(parsed?.topics) ? parsed.topics : [];

  if (topics.length === 0) {
    if (parsed?.raw) {
      // Gemini ตอบไม่เป็น JSON ที่ใช้ได้ตอนสรุป เก็บข้อความดิบไว้ ให้ fallback แสดงแบบข้อความ
      return `<div class="entry-summary">${escapeHtml(parsed.raw)}</div>`;
    }
    return '<div class="entry-summary empty">ไม่มีสาระสำคัญที่บันทึกไว้สำหรับวันนี้</div>';
  }

  const fields = [
    { key: 'what', label: 'อะไร (What)', colClass: 'col-what' },
    { key: 'who', label: 'ใคร (Who)', colClass: 'col-who' },
    { key: 'when', label: 'เมื่อไหร่ (When)', colClass: 'col-when' },
    { key: 'where', label: 'ที่ไหน (Where)', colClass: 'col-where' },
    { key: 'why', label: 'ทำไม (Why)', colClass: 'col-why' },
    { key: 'how', label: 'อย่างไร (How)', colClass: 'col-how' }
  ];

  const colgroup = `<colgroup><col class="col-no" />${fields
    .map((f) => `<col class="${f.colClass}" />`)
    .join('')}</colgroup>`;
  const headerRow = `<tr><th>#</th>${fields.map((f) => `<th>${escapeHtml(f.label)}</th>`).join('')}</tr>`;
  const bodyRows = topics
    .map(
      (t, idx) => `<tr>
        <td class="col-topic-no">${idx + 1}</td>
        ${fields.map((f) => `<td>${escapeHtml(t?.[f.key] || 'ไม่ระบุ')}</td>`).join('')}
      </tr>`
    )
    .join('');

  return `<div class="summary-table-wrap"><table class="summary-table">${colgroup}<thead>${headerRow}</thead><tbody>${bodyRows}</tbody></table></div>`;
}

async function loadSummaries() {
  const content = document.getElementById('content');
  content.innerHTML = '<p class="state-msg">กำลังโหลด...</p>';
  try {
    const params = new URLSearchParams({ group_id: currentGroupId });
    if (fromDate) params.set('from', fromDate);
    if (toDate) params.set('to', toDate);
    const res = await api(`/api/summaries?${params.toString()}`);
    const summaries = await res.json();
    if (summaries.length === 0) {
      content.innerHTML = '<p class="state-msg">ไม่มีสรุปในช่วงวันที่ที่เลือกสำหรับกลุ่มนี้ ลองเปลี่ยนช่วงวันที่ หรือกดปุ่ม "สรุปวันนี้ทันที" เพื่อสร้างสรุปแรก</p>';
      return;
    }
    content.innerHTML = `<div class="ledger">${summaries
      .map(
        (s) => `
      <div class="entry">
        <p class="entry-date">${formatThaiDate(s.date)}</p>
        <p class="entry-meta">${s.message_count} ข้อความ</p>
        ${renderSummaryBlock(s.summary)}
        ${
          s.images && s.images.length > 0
            ? `<div class="entry-images">${s.images
                .map(
                  (img) => `
          <figure class="entry-image">
            <img src="${img.url}" alt="${escapeHtml(img.caption || 'รูปภาพประกอบ')}" loading="lazy" />
            <figcaption>${escapeHtml(img.caption || '')}</figcaption>
          </figure>`
                )
                .join('')}</div>`
            : ''
        }
      </div>`
      )
      .join('')}</div>`;
  } catch (e) {
    if (e.message !== 'unauthorized') {
      content.innerHTML = '<p class="state-msg error">โหลดสรุปไม่สำเร็จ</p>';
    }
  }
}

document.getElementById('summarizeBtn').addEventListener('click', async () => {
  if (!currentGroupId) return;
  const btn = document.getElementById('summarizeBtn');
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = 'กำลังสรุป...';
  try {
    const res = await api('/api/summarize-now', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ group_id: currentGroupId })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'สรุปไม่สำเร็จ');
    await loadSummaries();
  } catch (e) {
    if (e.message !== 'unauthorized') alert(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
});

document.getElementById('fromDate').addEventListener('change', (e) => {
  applyDateRange(e.target.value || null, toDate, null);
});
document.getElementById('toDate').addEventListener('change', (e) => {
  applyDateRange(fromDate, e.target.value || null, null);
});
document.getElementById('quickToday').addEventListener('click', () => {
  const t = todayBangkok();
  applyDateRange(t, t, 'quickToday');
});
document.getElementById('quick7').addEventListener('click', () => {
  const t = todayBangkok();
  applyDateRange(addDaysToDateStr(t, -6), t, 'quick7');
});
document.getElementById('quick30').addEventListener('click', () => {
  const t = todayBangkok();
  applyDateRange(addDaysToDateStr(t, -29), t, 'quick30');
});
document.getElementById('quickAll').addEventListener('click', () => {
  applyDateRange(null, null, 'quickAll');
});

// ตั้งค่าเริ่มต้นของ input ให้เป็นวันนี้ และไฮไลต์ปุ่ม "วันนี้"
document.getElementById('fromDate').value = fromDate;
document.getElementById('toDate').value = toDate;
setQuickRangeActive('quickToday');

loadGroups();
</script>
</body>
</html>
