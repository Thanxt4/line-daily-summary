<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>สมุดบันทึกกลุ่มไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-900: #14261F;
    --ink-800: #1A322A;
    --ink-700: #23413A;
    --paper-050: #F6F2E9;
    --paper-100: #ECE4D2;
    --paper-200: #E1D7BE;
    --brass-500: #B08D3D;
    --brass-600: #96742E;
    --text-900: #1B1B18;
    --text-600: #5B5B4F;
    --text-on-dark: #F1ECDE;
    --text-on-dark-dim: #A9BBB2;
    --danger: #B3462C;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Sarabun', sans-serif;
    color: var(--text-900);
    background: var(--paper-050);
  }
  .app {
    display: flex;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 268px;
    flex-shrink: 0;
    background: var(--ink-900);
    color: var(--text-on-dark);
    display: flex;
    flex-direction: column;
    padding: 28px 22px;
  }
  .brand {
    margin-bottom: 30px;
  }
  .brand .mark {
    font-family: 'Kanit', sans-serif;
    font-weight: 500;
    font-size: 12px;
    color: var(--brass-500);
    margin: 0 0 4px;
  }
  .brand h1 {
    font-family: 'Kanit', sans-serif;
    font-weight: 700;
    font-size: 21px;
    line-height: 1.3;
    margin: 0;
    color: var(--text-on-dark);
  }
  .group-list-label {
    font-size: 12.5px;
    color: var(--text-on-dark-dim);
    margin: 0 0 10px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .group-list {
    list-style: none;
    margin: 0;
    padding: 0;
    flex: 1;
    overflow-y: auto;
  }
  .group-item {
    padding: 11px 12px;
    border-radius: 3px;
    font-size: 14.5px;
    cursor: pointer;
    color: var(--text-on-dark-dim);
    margin-bottom: 3px;
    line-height: 1.4;
    word-break: break-word;
  }
  .group-item:hover { background: rgba(255,255,255,0.06); color: var(--text-on-dark); }
  .group-item.active {
    background: var(--brass-500);
    color: var(--ink-900);
    font-weight: 600;
  }
  .empty-groups {
    font-size: 13.5px;
    color: var(--text-on-dark-dim);
    padding: 8px 4px;
    line-height: 1.6;
  }
  .sidebar-footer {
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 16px;
    margin-top: 12px;
  }
  .logout-form button {
    width: 100%;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.18);
    color: var(--text-on-dark-dim);
    padding: 9px 10px;
    border-radius: 3px;
    font-family: 'Sarabun', sans-serif;
    font-size: 13.5px;
    cursor: pointer;
  }
  .logout-form button:hover { color: var(--text-on-dark); border-color: rgba(255,255,255,0.35); }

  /* ---------- Main content ---------- */
  .main {
    flex: 1;
    padding: 40px 48px 60px;
    max-width: 760px;
  }
  .main-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 34px;
    border-bottom: 1px solid var(--paper-200);
    padding-bottom: 22px;
  }
  .main-header h2 {
    font-family: 'Kanit', sans-serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0 0 4px;
    color: var(--ink-900);
  }
  .main-header p {
    margin: 0;
    font-size: 13.5px;
    color: var(--text-600);
  }
  .btn-summarize {
    flex-shrink: 0;
    background: var(--ink-900);
    color: var(--text-on-dark);
    border: none;
    padding: 11px 20px;
    border-radius: 3px;
    font-family: 'Sarabun', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-summarize:hover { background: var(--ink-700); }
  .btn-summarize:disabled { opacity: 0.55; cursor: default; }

  /* ---------- Ledger timeline ---------- */
  .ledger {
    position: relative;
    padding-left: 26px;
  }
  .ledger::before {
    content: '';
    position: absolute;
    left: 5px;
    top: 6px;
    bottom: 6px;
    width: 1px;
    background: var(--paper-200);
  }
  .entry {
    position: relative;
    padding-bottom: 34px;
  }
  .entry::before {
    content: '';
    position: absolute;
    left: -26px;
    top: 5px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--brass-500);
    border: 2px solid var(--paper-050);
    box-shadow: 0 0 0 1px var(--paper-200);
  }
  .entry-date {
    font-family: 'Kanit', sans-serif;
    font-weight: 600;
    font-size: 15.5px;
    color: var(--ink-900);
    margin: 0 0 3px;
  }
  .entry-meta {
    font-size: 12.5px;
    color: var(--text-600);
    margin: 0 0 12px;
  }
  .entry-summary {
    background: var(--paper-100);
    border-radius: 3px;
    padding: 16px 18px;
    font-size: 14.5px;
    line-height: 1.7;
    white-space: pre-wrap;
    color: var(--text-900);
  }
  .entry-images {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 14px;
  }
  .entry-image {
    margin: 0;
    width: 152px;
  }
  .entry-image img {
    width: 100%;
    height: 110px;
    object-fit: cover;
    border-radius: 3px;
    border: 1px solid var(--paper-200);
    display: block;
    background: var(--paper-100);
  }
  .entry-image figcaption {
    font-size: 12px;
    color: var(--text-600);
    margin-top: 5px;
    line-height: 1.4;
  }

  .state-msg {
    color: var(--text-600);
    font-size: 14px;
    padding: 12px 0;
  }
  .state-msg.error { color: var(--danger); }
</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <p class="mark">Daily Digest</p>
        <h1>สมุดบันทึก<br/>กลุ่มไลน์</h1>
      </div>
      <p class="group-list-label">กลุ่มที่เชื่อมต่อ</p>
      <ul class="group-list" id="groupList">
        <li class="empty-groups">กำลังโหลด...</li>
      </ul>
      <div class="sidebar-footer">
        <form class="logout-form" method="POST" action="/logout">
          <button type="submit">ออกจากระบบ</button>
        </form>
      </div>
    </aside>

    <main class="main">
      <div class="main-header">
        <div>
          <h2 id="groupTitle">เลือกกลุ่มทางซ้าย</h2>
          <p id="groupSub">สรุปบทสนทนาประจำวันจะแสดงที่นี่</p>
        </div>
        <button class="btn-summarize" id="summarizeBtn" disabled>สรุปวันนี้ทันที</button>
      </div>

      <div id="content">
        <p class="state-msg">เลือกกลุ่มไลน์จากเมนูด้านซ้ายเพื่อดูสรุปประจำวัน</p>
      </div>
    </main>
  </div>

<script>
let currentGroupId = null;
let currentGroupName = '';

async function api(path, options) {
  const res = await fetch(path, options);
  if (res.status === 401) {
    location.href = '/login';
    throw new Error('unauthorized');
  }
  return res;
}

function formatThaiDate(dateStr) {
  const months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const [y, m, d] = dateStr.split('-').map(Number);
  return `${d} ${months[m - 1]} ${y + 543}`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function loadGroups() {
  const listEl = document.getElementById('groupList');
  try {
    const res = await api('/api/groups');
    const groups = await res.json();
    if (groups.length === 0) {
      listEl.innerHTML = '<li class="empty-groups">ยังไม่มีกลุ่มไลน์เข้ามา<br/>รอข้อความแรกจากกลุ่ม</li>';
      return;
    }
    listEl.innerHTML = groups
      .map((g) => `<li class="group-item" data-id="${g.group_id}" data-name="${escapeHtml(g.group_name || g.group_id)}">${escapeHtml(g.group_name || g.group_id)}</li>`)
      .join('');
    listEl.querySelectorAll('.group-item').forEach((el) => {
      el.addEventListener('click', () => selectGroup(el.dataset.id, el.dataset.name, el));
    });
    if (groups.length > 0) {
      const first = listEl.querySelector('.group-item');
      selectGroup(first.dataset.id, first.dataset.name, first);
    }
  } catch (e) {
    if (e.message !== 'unauthorized') {
      listEl.innerHTML = '<li class="empty-groups">โหลดรายชื่อกลุ่มไม่สำเร็จ</li>';
    }
  }
}

function selectGroup(groupId, groupName, el) {
  currentGroupId = groupId;
  currentGroupName = groupName;
  document.querySelectorAll('.group-item').forEach((e) => e.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('groupTitle').textContent = groupName;
  document.getElementById('groupSub').textContent = 'สรุปบทสนทนาประจำวัน เรียงจากล่าสุด';
  document.getElementById('summarizeBtn').disabled = false;
  loadSummaries();
}

async function loadSummaries() {
  const content = document.getElementById('content');
  content.innerHTML = '<p class="state-msg">กำลังโหลด...</p>';
  try {
    const res = await api(`/api/summaries?group_id=${encodeURIComponent(currentGroupId)}`);
    const summaries = await res.json();
    if (summaries.length === 0) {
      content.innerHTML = '<p class="state-msg">ยังไม่มีสรุปสำหรับกลุ่มนี้ กดปุ่ม "สรุปวันนี้ทันที" เพื่อสร้างสรุปแรก</p>';
      return;
    }
    content.innerHTML = `<div class="ledger">${summaries
      .map(
        (s) => `
      <div class="entry">
        <p class="entry-date">${formatThaiDate(s.date)}</p>
        <p class="entry-meta">${s.message_count} ข้อความ</p>
        <div class="entry-summary">${escapeHtml(s.summary || '')}</div>
        ${
          s.images && s.images.length > 0
            ? `<div class="entry-images">${s.images
                .map(
                  (img) => `
          <figure class="entry-image">
            <img src="${img.url}" alt="${escapeHtml(img.caption || 'รูปภาพประกอบ')}" loading="lazy" />
            <figcaption>${escapeHtml(img.caption || '')}</figcaption>
          </figure>`
                )
                .join('')}</div>`
            : ''
        }
      </div>`
      )
      .join('')}</div>`;
  } catch (e) {
    if (e.message !== 'unauthorized') {
      content.innerHTML = '<p class="state-msg error">โหลดสรุปไม่สำเร็จ</p>';
    }
  }
}

document.getElementById('summarizeBtn').addEventListener('click', async () => {
  if (!currentGroupId) return;
  const btn = document.getElementById('summarizeBtn');
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = 'กำลังสรุป...';
  try {
    const res = await api('/api/summarize-now', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ group_id: currentGroupId })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'สรุปไม่สำเร็จ');
    await loadSummaries();
  } catch (e) {
    if (e.message !== 'unauthorized') alert(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
});

loadGroups();
</script>
</body>
</html>
